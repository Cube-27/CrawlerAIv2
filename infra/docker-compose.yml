# Local development only (SPEC-00 §4.4). Objects use the filesystem store under ./.data/objects; there is no
# object store container.
name: crawlerai

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Healthy only once the final server accepts TCP. On a fresh volume the entrypoint first runs init.sql on a
      # temporary socket-only server, which a socket check would already count as ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "crawlerai"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
