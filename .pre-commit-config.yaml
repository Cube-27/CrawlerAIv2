# Fast checks on staged files (SPEC-00 §4.8; budget: under 10 s for a typical change). mypy, the test suites and the
# other CI jobs run in `make check` and CI. No hook counts lines or complexity (C11).
# Install with `uvx pre-commit install` (pre-commit >= 4). The hook goes into the clone's shared hooks directory, so
# it covers every worktree. The local hooks run the tools that backend/uv.lock and frontend/pnpm-lock.yaml pin: they
# need `uv` and `pnpm install` in frontend/.

# Pinned data keeps its exact bytes (.gitattributes), and generated files must match a fresh generator run.
exclude: ^(backend/data/|frontend/openapi\.json$|frontend/src/api/schema\.d\.ts$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      # ruff finds the nearest config per file: backend/pyproject.toml, or tools/ruff.toml for the repo tools.
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      # C3, INV-03: the index content of every staged file, with the same exemptions as CI.
      - id: site-literals
        name: site-literal scan
        entry: python tools/site_literal_scan.py --public --staged
        language: python
        pass_filenames: false
      # Vite+ formats (Oxfmt), lints (Oxlint) and type-checks (tsgo) the staged frontend files with the config in
      # frontend/vite.config.ts. vp resolves paths from frontend/, so the hook strips the `frontend/` prefix: a
      # root-relative path matches no lint input and passes unchecked.
      - id: vite-plus
        name: vp check
        entry: sh -c 'cd frontend && for f; do set -- "$@" "${f#frontend/}"; shift; done && exec node node_modules/vite-plus/bin/vp check --fix --no-error-on-unmatched-pattern "$@"' --
        language: system
        files: ^frontend/
        # Each type-aware process builds the whole TypeScript program, so one process beats parallel chunks.
        require_serial: true
