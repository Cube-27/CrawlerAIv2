[project]
name = "crawlerai"
version = "0.1.0"
description = "Schema-driven web extraction engine."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
crawlerai = "crawlerai.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# S102 (exec) and S307 (eval) come with "S": LLM output is never executed (ARCHITECTURE §18).
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "import-linter>=2,<3",
    "mypy>=1,<2",
    "pytest>=8,<10",
    "ruff>=0.17,<1",
]
licenses = [
    "cyclonedx-bom>=7,<8",
    "pip-licenses>=5,<6",
]
