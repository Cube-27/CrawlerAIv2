[project]
name = "crawlerai"
version = "0.1.0"
description = "Schema-driven web extraction engine."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "anthropic>=1.13,<2",
    "anyio>=4.4,<5",
    "asyncpg>=0.29,<1",
    "babel>=2.16,<3",
    "boto3>=1.35,<2",
    "cronsim>=2.6,<3",
    "cryptography>=44,<51",
    "cssselect>=1.2,<2",
    # acquire/http.py works around 0.16's handle release order through the session's internals (UAT F06): an
    # upgrade re-checks that workaround.
    "curl-cffi>=0.16,<0.17",
    "dateparser>=1.2,<2",
    "fastapi>=0.115,<1",
    "google-genai>=2.30,<3",
    "httpx>=0.27,<1",
    "httpx2>=2.13,<3",
    "jinja2>=3.1,<4",
    "jsonpath-ng>=1.8,<1.9",
    "jsonschema>=4.23,<5",
    "lxml>=5,<7",
    "markupsafe>=3,<4",
    "mcp>=1.20,<2",
    "openpyxl>=3.1.5",
    "patchright>=1.63,<2",
    "price-parser>=0.4,<1",
    "protego>=0.4,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyyaml>=6,<7",
    "selectolax>=0.3,<1",
    "sqlalchemy[asyncio]>=2,<3",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1",
    "webencodings>=0.5,<1",
    "zstandard>=0.23,<1",
]

[project.scripts]
crawlerai = "crawlerai.cli:main"

[project.optional-dependencies]
parquet = [
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# Writes VERSION and puts it and the manifest's data files in the wheel (hatch_build.py).
[tool.hatch.build.hooks.custom]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# S102 (exec) and S307 (eval) come with "S": LLM output is never executed.
# PT012: one statement per `pytest.raises` block (SonarCloud S5778 recurred; openspec/conventions/RECURRING.md).
# PT018: one condition per assert, and PT022: no `yield` in a fixture without teardown (SonarCloud S9073 and S9100
# recurred). C420: `dict.fromkeys` for one value per key (S7519); FAST: no `response_model` the return annotation
# already gives (S8409), and FastAPI's other stock checks.
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT012", "PT018", "PT022", "C420", "FAST"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# C11: cognitive complexity of at most 15 per function, as SonarSource defines it (G. Ann Campbell, "Cognitive
# Complexity", 2017; SonarCloud rule S3776). Run as `complexipy` from backend/, with `--no-ignore` so that inline
# suppressions don't count.
[tool.complexipy]
paths = ["src", "tests", "migrations", "../tools"]
max-complexity-allowed = 15
failed = true

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
# Test directories have no `__init__.py`; module names come from their paths, so two `conftest.py` files coexist.
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# pyarrow ships no type information; `config_ir.exporters.files` keeps it behind `Any`.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
# A hung test fails after 60 s instead of holding CI until the job's limit (a time limit, not a size gate). A test that
# legitimately needs longer says so with `@pytest.mark.timeout(<seconds>)`.
timeout = 60
markers = [
    "browser: drives headless Chromium (`uv run patchright install --no-shell chromium` once); skipped where it is not installed, except in CI",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35,<2",
    "complexipy>=8,<9",
    # The wheel-build test runs the build hook in-process (tests/unit/test_wheel.py).
    "hatchling>=1.27,<2",
    "hypothesis>=6,<7",
    "import-linter>=2,<3",
    "moto[s3]>=5,<6",
    "mypy>=1,<2",
    "pyarrow>=17",
    "pytest>=8,<10",
    "pytest-timeout>=2,<3",
    "pytest-xdist>=3,<4",
    "ruff>=0.17,<1",
    "types-dateparser>=1.2,<2",
    "types-jsonschema>=4.23,<5",
    "types-lxml>=2026.2,<2027",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6,<7",
]
licenses = [
    "cyclonedx-bom>=7,<8",
    "pip-licenses>=5,<6",
]
