[project]
name = "crawlerai"
version = "0.1.0"
description = "Schema-driven web extraction engine."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "anthropic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "babel>=2.16,<3",
    "boto3>=1.35,<2",
    "cssselect>=1.2,<2",
    "curl-cffi>=0.16,<1",
    "dateparser>=1.2,<2",
    "fastapi>=0.115,<1",
    "google-genai>=2.30,<3",
    "httpx>=0.27,<1",
    "httpx2>=2.13,<3",
    "jsonpath-ng>=1.8,<1.9",
    "jsonschema>=4.23,<5",
    "lxml>=5,<7",
    "patchright>=1.63,<2",
    "price-parser>=0.4,<1",
    "protego>=0.4,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyyaml>=6,<7",
    "selectolax>=0.3,<1",
    "sqlalchemy[asyncio]>=2,<3",
    "trafilatura>=2,<3",
    "uvicorn>=0.30,<1",
    "zstandard>=0.23,<1",
]

[project.scripts]
crawlerai = "crawlerai.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# S102 (exec) and S307 (eval) come with "S": LLM output is never executed (ARCHITECTURE §18).
# PT012: one statement per `pytest.raises` block (SonarCloud S5778 recurred; docs/plans/RECURRING.md).
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# C11: cognitive complexity of at most 15 per function, as SonarSource defines it (G. Ann Campbell, "Cognitive
# Complexity", 2017; SonarCloud rule S3776). Run as `complexipy` from backend/, with `--no-ignore` so that inline
# suppressions don't count.
[tool.complexipy]
paths = ["src", "tests", "migrations", "../tools"]
max-complexity-allowed = 15
failed = true

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
# Test directories have no `__init__.py`; module names come from their paths, so two `conftest.py` files coexist.
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "browser: drives headless Chromium (`uv run patchright install chromium` once); skipped where it is not installed, except in CI",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35,<2",
    "complexipy>=8,<9",
    "hypothesis>=6,<7",
    "import-linter>=2,<3",
    "moto[s3]>=5,<6",
    "mypy>=1,<2",
    "pytest>=8,<10",
    "ruff>=0.17,<1",
    "types-dateparser>=1.2,<2",
    "types-jsonschema>=4.23,<5",
    "types-lxml>=2026.2,<2027",
    "types-pyyaml>=6,<7",
]
licenses = [
    "cyclonedx-bom>=7,<8",
    "pip-licenses>=5,<6",
]
