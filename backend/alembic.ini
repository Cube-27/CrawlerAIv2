[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
# The database URL comes from CRAWLERAI_DATABASE_URL (see migrations/env.py), never from this file.

# The private eval database (SPEC-03 §4.2), migrated by the custodian with `alembic -n private upgrade head`. Same
# environment, its own revisions; the URL comes from CRAWLERAI_EVAL_PRIVATE_DATABASE_URL.
[private]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/private_versions
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
