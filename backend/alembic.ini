[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
# The database URL comes from CRAWLERAI_DATABASE_URL (see migrations/env.py), never from this file.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
