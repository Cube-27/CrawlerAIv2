name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SPEC-00 §4.6. Later SPEC-00 rows add the replay split and the other jobs.
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      # Dependencies install from the lockfile's wheels only (`--no-build`), so no third-party build script runs.
      # The project alone is built from this repo's source (`--no-binary-package crawlerai`) and installed
      # non-editable, and every later step runs without re-syncing.
      - run: uv sync --frozen --no-build --no-binary-package crawlerai --no-editable
      - run: uv run --no-sync --no-build ruff check
      - run: uv run --no-sync --no-build ruff format --check
      - run: uv run --no-sync --no-build mypy src tests migrations
      - run: uv run --no-sync --no-build lint-imports
      - name: Create databases and roles
        working-directory: .
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f infra/postgres/init.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -c 'CREATE DATABASE crawlerai_private_test OWNER app'
        env:
          PGPASSWORD: postgres
      - name: Alembic upgrade, downgrade, upgrade
        run: |
          uv run --no-sync --no-build alembic upgrade head
          uv run --no-sync --no-build alembic downgrade base
          uv run --no-sync --no-build alembic upgrade head
        env:
          CRAWLERAI_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/crawlerai
      # tests/db own the database they run against (tests/db/conftest.py); they are skipped only where no test
      # database URL is set. This job's service is throwaway, so they reuse the migrated database. The private eval
      # store's tests get a throwaway database of their own, never `crawlerai_eval_private` (C1).
      - run: uv run --no-sync --no-build pytest
        env:
          CRAWLERAI_TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/crawlerai
          CRAWLERAI_TEST_PRIVATE_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/crawlerai_private_test

  # SPEC-00 §4.6, including the API client freshness check (§4.5).
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Vite+: format check (Oxfmt), lint (Oxlint) and the strict type-check (tsgo) in one pass.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      # Installed as in the backend job: dependency wheels only, the project built from this repo's source.
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen --no-build --no-binary-package crawlerai --no-editable
      - name: API client freshness
        working-directory: .
        run: |
          make api-client UV_RUN="uv run --no-sync --no-build"
          git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts || {
            echo "::error::API client out of date: run 'make api-client' and commit the result."
            exit 1
          }

  # SPEC-00 §4.6 job 4: no site literals outside adapters/ (C3, INV-03). Also lints and tests the repo tools.
  site-literals:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      # The tools need only the dev tooling, not the backend package, so nothing is built.
      - run: uv sync --frozen --no-build --no-install-project
      - run: uv run --no-sync --no-build ruff check ../tools
      - run: uv run --no-sync --no-build ruff format --check ../tools
      - run: uv run --no-sync --no-build mypy --strict ../tools
      - run: uv run --no-sync --no-build pytest ../tools/tests
      - run: uv run --no-sync --no-build python ../tools/site_literal_scan.py --public

  # SPEC-00 §4.6 job 5: every file under backend/data/ is pinned in the manifest (C4, INV-05).
  data-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/data_manifest_check.py

  # SPEC-00 §4.6 job 3: dependency license deny-list and CycloneDX SBOMs (ARCHITECTURE §18).
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: tools/license_scan.sh license-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: license-report
          path: license-report/

  # SPEC-00 §4.6 job 6: no size, complexity or coverage-threshold gate in CI, hooks or tool configs (C11, INV-18).
  no-size-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/no_size_gates.py
