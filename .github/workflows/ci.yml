name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SPEC-00 §4.6. Later SPEC-00 rows add the replay split, alembic and the other jobs.
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen mypy src tests
      # --no-build satisfies SonarCloud S8541; --no-sync is needed with it because the editable project has no wheel.
      # The environment is already installed by `uv sync --frozen` above.
      - run: uv run --no-sync --no-build lint-imports
      - run: uv run --frozen pytest

  # SPEC-00 §4.6. SPEC-00 PR 4 adds the API client freshness check.
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # SPEC-00 §4.6 job 4: no site literals outside adapters/ (C3, INV-03). Also lints and tests the repo tools.
  site-literals:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      # The tools need only the dev tooling, not the backend package, so nothing is built.
      - run: uv sync --frozen --no-build --no-install-project
      - run: uv run --no-sync --no-build ruff check ../tools
      - run: uv run --no-sync --no-build ruff format --check ../tools
      - run: uv run --no-sync --no-build mypy --strict ../tools
      - run: uv run --no-sync --no-build pytest ../tools/tests
      - run: uv run --no-sync --no-build python ../tools/site_literal_scan.py --public

  # SPEC-00 §4.6 job 5: every file under backend/data/ is pinned in the manifest (C4, INV-05).
  data-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/data_manifest_check.py
