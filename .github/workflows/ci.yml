name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which path-gated jobs a pull request needs, from the files it changes (tools/ci_changes.py; owner, 2026-10-15: a
  # docs-only PR runs no backend). A gated job that is not needed is skipped, and a skipped job counts as passed for
  # required checks. A push to main runs every job.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      licenses: ${{ steps.filter.outputs.licenses }}
      verify_worker_queue: ${{ steps.filter.outputs.verify_worker_queue }}
      verify_money: ${{ steps.filter.outputs.verify_money }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # `shell: bash` runs with `-o pipefail`, so a failed `git diff` fails this job rather than feeding the tool an
      # empty list that skips every gated job. `--no-renames` lists a moved file under its old path too, so moving a
      # file out of a job's inputs still runs that job.
      - id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --no-renames --name-only "$BASE...$HEAD" | python3 tools/ci_changes.py >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci_changes.py --all >> "$GITHUB_OUTPUT"
          fi

  # SPEC-00 §4.6. Later SPEC-00 rows add the replay split and the other jobs.
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    env:
      # pytest-xdist workers: one per vCPU of the runner (ubuntu-24.04 on a public repository has 4).
      PYTEST_WORKERS: 4
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      # Dependencies install from the lockfile's wheels only (`--no-build`), so no third-party build script runs.
      # The project alone is built from this repo's source (`--no-binary-package crawlerai`) and installed
      # non-editable, and every later step runs without re-syncing.
      - run: uv sync --frozen --no-build --no-binary-package crawlerai --no-editable
      - run: uv run --no-sync --no-build ruff check
      - run: uv run --no-sync --no-build ruff format --check
      - run: uv run --no-sync --no-build mypy src tests migrations
      - run: uv run --no-sync --no-build lint-imports
      # C11: cognitive complexity of at most 15 per function, for src, tests, migrations and ../tools
      # ([tool.complexipy] in pyproject.toml). `--no-ignore`: an inline suppression does not exempt a function.
      - run: uv run --no-sync --no-build complexipy --no-ignore
      # Full Chromium, run headless, for the `browser`-marked tests (SPEC-02 §6), at the build this Patchright version pins.
      - run: uv run --no-sync --no-build patchright install --with-deps --no-shell chromium
      - name: Create databases and roles
        working-directory: .
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f infra/postgres/init.sql
        env:
          PGPASSWORD: postgres
      - name: Alembic upgrade, downgrade, upgrade
        run: |
          uv run --no-sync --no-build alembic upgrade head
          uv run --no-sync --no-build alembic downgrade base
          uv run --no-sync --no-build alembic upgrade head
        env:
          CRAWLERAI_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/crawlerai
      # A test database per pytest worker. The main ones are copies of the migrated `crawlerai`
      # (TEMPLATE), so the workers' upgrade to head finds nothing to do.
      - name: Create the test databases
        run: |
          args=()
          for ((i = 0; i < PYTEST_WORKERS; i++)); do
            args+=(-c "CREATE DATABASE crawlerai_gw$i TEMPLATE crawlerai OWNER app")
          done
          psql -v ON_ERROR_STOP=1 -q -h localhost -U postgres "${args[@]}"
        env:
          PGPASSWORD: postgres
      # tests/db own the database they run against (tests/db/conftest.py); they are skipped only where no test
      # database URL is set. Each xdist worker suffixes the names below with its id (`_gw0`, ...). `--durations=20` lists
      # the slowest tests in the log.
      - run: uv run --no-sync --no-build pytest -n "$PYTEST_WORKERS" --durations=20
        env:
          CRAWLERAI_TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/crawlerai

  # The verify-money skill's one command (.claude/skills/verify-money/SKILL.md): money property checks with the `verify`
  # Hypothesis profile, on a PR that touches the money code (tools/ci_changes.py). No database, no browser.
  verify-money:
    needs: changes
    if: needs.changes.outputs.verify_money == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      - run: uv sync --frozen --no-build --no-binary-package crawlerai --no-editable
      - run: uv run --no-sync --no-build pytest tests/property/test_money_properties.py -q --hypothesis-profile=verify

  # SPEC-00 §4.6, including the API client freshness check (§4.5).
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Visual values only in theme.css, UI only from @heroui/react (openspec/conventions/DESIGN.md, Theming and Stack). Needs no
      # node_modules, so it runs before the install.
      - run: python3 ../tools/theme_only_check.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Vite+: format check (Oxfmt), lint (Oxlint) and the strict type-check (tsgo) in one pass.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      # Installed as in the backend job: dependency wheels only, the project built from this repo's source.
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen --no-build --no-binary-package crawlerai --no-editable
      - name: API client freshness
        working-directory: .
        run: |
          make api-client UV_RUN="uv run --no-sync --no-build"
          git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts || {
            echo "::error::API client out of date: run 'make api-client' and commit the result."
            exit 1
          }

  # The worker/queue concurrency model checked with TLC (.claude/skills/verify-worker-queue/SKILL.md), when a change
  # touches the code it models. The runner's Java runs TLC; the script fetches the pinned tla2tools.jar.
  verify-worker-queue:
    needs: changes
    if: needs.changes.outputs.verify_worker_queue == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/verify/worker_queue.py
        env:
          TLC_HEAP: 4g

  # SPEC-00 §4.6 job 4: no site literals outside adapters/ (C3, INV-03). Also lints and tests the repo tools and checks
  # the decisions log.
  site-literals:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      # The tools need only the dev tooling, not the backend package, so nothing is built.
      - run: uv sync --frozen --no-build --no-install-project
      - run: uv run --no-sync --no-build ruff check ../tools
      - run: uv run --no-sync --no-build ruff format --check ../tools
      - run: uv run --no-sync --no-build mypy --strict ../tools
      - run: uv run --no-sync --no-build pytest ../tools/tests
      - run: uv run --no-sync --no-build python ../tools/site_literal_scan.py --public
      # One decision ID per entry across every Markdown file under openspec/ (D-0823, D-1136).
      - run: uv run --no-sync --no-build python ../tools/decision_ids.py

  # SPEC-00 §4.6 job 5: every file under backend/data/ is pinned in the manifest (C4, INV-05).
  data-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/data_manifest_check.py

  # SPEC-00 §4.6 job 3: dependency license deny-list and CycloneDX SBOMs (ARCHITECTURE §18).
  licenses:
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: tools/license_scan.sh license-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: license-report
          path: license-report/

  # SPEC-00 §4.6 job 6: no size, complexity or coverage-threshold gate in CI, hooks or tool configs beyond C11's two
  # (INV-18), and the soft file-length limit, which only warns.
  no-size-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/no_size_gates.py
      - run: python3 tools/file_length.py
