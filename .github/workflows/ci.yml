name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Each job's checks are one `tools/dev.py check-<job>` command, the one definition `uv run tools/dev.py check` also runs
# locally; a job here only checks out, installs and starts services. `UV_RUN`: dev.py runs against the environment the
# job installed (`uv sync` below), without re-syncing or building.
env:
  UV_RUN: uv run --no-sync --no-build

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which path-gated jobs a pull request needs, from the files it changes (tools/ci_changes.py; owner, 2026-10-15: a
  # docs-only PR runs no backend). A gated job that is not needed is skipped, and a skipped job counts as passed for
  # required checks. A push to main runs every job.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend_static: ${{ steps.filter.outputs.backend_static }}
      frontend: ${{ steps.filter.outputs.frontend }}
      api_client: ${{ steps.filter.outputs.api_client }}
      licenses: ${{ steps.filter.outputs.licenses }}
      verify_worker_queue: ${{ steps.filter.outputs.verify_worker_queue }}
      verify_money: ${{ steps.filter.outputs.verify_money }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # `shell: bash` runs with `-o pipefail`, so a failed `git diff` fails this job rather than feeding the tool an
      # empty list that skips every gated job. `--no-renames` lists a moved file under its old path too, so moving a
      # file out of a job's inputs still runs that job.
      - id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --no-renames --name-only "$BASE...$HEAD" | python3 tools/ci_changes.py >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci_changes.py --all >> "$GITHUB_OUTPUT"
          fi

  # the backend's static checks, beside the tests (`backend`) so neither waits for the other.
  backend-static:
    needs: changes
    if: needs.changes.outputs.backend_static == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      # Installed as in the backend job: dependency wheels only, the project built from this repo's source.
      - run: uv sync --frozen --no-build --no-binary-package crawlerai --no-editable
      # mypy's incremental cache, per lockfile: each run saves its own, and restores the newest for the same lockfile
      # (a pull request also reads main's). mypy re-checks every module whose source changed, so a stale cache only
      # costs time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.mypy_cache
          key: mypy-${{ hashFiles('backend/uv.lock') }}-${{ github.sha }}
          restore-keys: mypy-${{ hashFiles('backend/uv.lock') }}-
      - run: python3 ../tools/dev.py check-backend-static

  # migrations and the tests. Later rows add the replay split and the other jobs.
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    env:
      # pytest-xdist workers: one per vCPU of the runner (ubuntu-24.04 on a public repository has 4).
      PYTEST_WORKERS: 4
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      # Dependencies install from the lockfile's wheels only (`--no-build`), so no third-party build script runs.
      # The project alone is built from this repo's source (`--no-binary-package crawlerai`) and installed
      # non-editable, and every later step runs without re-syncing.
      - run: uv sync --frozen --no-build --no-binary-package crawlerai --no-editable
      # Google Chrome stable, run headless, for the `browser`-marked tests, installed as the Patchright
      # README sets it up (the browser rung's `chrome` channel).
      - run: uv run --no-sync --no-build patchright install --with-deps chrome
      - name: Create databases and roles
        working-directory: .
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f infra/postgres/init.sql
        env:
          PGPASSWORD: postgres
      # The migrations, then the tests in one database per pytest worker (`tools/dev.py check-backend`).
      - run: python3 ../tools/dev.py check-backend
        env:
          PSQL: psql -h 127.0.0.1 -U postgres
          PGPASSWORD: postgres

  # The verify-money skill's one command (.claude/skills/verify-money/SKILL.md): money property checks with the `verify`
  # Hypothesis profile, on a PR that touches the money code (tools/ci_changes.py). No database, no browser.
  verify-money:
    needs: changes
    if: needs.changes.outputs.verify_money == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      - run: uv sync --frozen --no-build --no-binary-package crawlerai --no-editable
      - run: python3 ../tools/dev.py check-verify-money

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: python3 ../tools/dev.py check-frontend

  # The API client freshness check: the committed client matches one generated from the backend.
  api-client:
    needs: changes
    if: needs.changes.outputs.api_client == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      # Installed as in the backend job: dependency wheels only, the project built from this repo's source.
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen --no-build --no-binary-package crawlerai --no-editable
      - run: python3 tools/dev.py check-api-client

  # The SDKs (`tools/dev.py check-sdk`, rest-api "SDKs"): both regenerated from frontend/openapi.json and compared with the
  # committed files, then each SDK's type check, lint and tests.
  sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sdk/typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      - run: python3 tools/dev.py check-sdk

  # The worker/queue concurrency model checked with TLC (.claude/skills/verify-worker-queue/SKILL.md), when a change
  # touches the code it models. The runner's Java runs TLC; the script fetches the pinned tla2tools.jar. Three shards
  # run every check, finding and mutant between them (`--shard i/3`: every third, from the i-th).
  verify-worker-queue:
    needs: changes
    if: needs.changes.outputs.verify_worker_queue == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/dev.py check-verify-worker-queue --shard ${{ matrix.shard }}/3
        env:
          TLC_HEAP: 4g

  # no site literals outside adapters/ (C3). Also lints and tests the repo tools and checks
  # the decisions log.
  site-literals:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      # The tools need only the dev tooling, not the backend package, so nothing is built.
      - run: uv sync --frozen --no-build --no-install-project
      - run: python3 ../tools/dev.py check-site-literals

  # every file under backend/data/ is pinned in the manifest (C4).
  data-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/dev.py check-data-manifest

  # dependency license deny-list and CycloneDX SBOMs.
  licenses:
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: python3 tools/dev.py check-licenses
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: license-report
          path: license-report/

  # no size, complexity or coverage-threshold gate in CI, hooks or tool configs beyond C11's two
  # checks, and the soft file-length limit, which only warns.
  no-size-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/dev.py check-no-size-gates
