name: claude-review

# Opt-in Claude code review; not the merge review (/review-pr is). The job lives in Cube-27/.github.
#   gh pr comment <n> --body "/claude-review"
#   gh workflow run claude-review.yml -f pr=<n>

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: Cube-27/.github/.github/workflows/claude-review.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
