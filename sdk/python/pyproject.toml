[project]
name = "snowcrawl-sdk"
version = "0.1.0"
description = "A typed Python client for the Snowcrawl API: scrape, map, crawl, batch, extract and search, with job polling, event streaming and webhook verification."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "anyio>=4", "datamodel-code-generator==0.35.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowcrawl_sdk"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "snowcrawl_sdk.models"
ignore_errors = true

[tool.ruff]
line-length = 120
extend-exclude = ["src/snowcrawl_sdk/models.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
