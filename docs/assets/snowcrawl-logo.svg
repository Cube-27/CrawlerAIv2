<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="380" height="96" viewBox="0 0 380 96" role="img" aria-label="Snowcrawl">
  <title>Snowcrawl</title>
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <!-- User space: a bounding-box gradient paints nothing on a straight stroke, whose box has no width. -->
    <linearGradient id="flake" gradientUnits="userSpaceOnUse" x1="0" y1="-42" x2="0" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <!-- One arm of the flake: a crawl path with two side branches, ending in a fetched node. -->
    <g id="arm" stroke="url(#flake)" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M0 -9 V-34"/>
      <path d="M0 -20 L-8 -27 M0 -20 L8 -27"/>
      <circle cx="0" cy="-38" r="4.5" fill="url(#flake)" stroke="none"/>
    </g>
  </defs>
  <g transform="translate(48 48)">
    <use xlink:href="#arm"/>
    <use xlink:href="#arm" transform="rotate(60)"/>
    <use xlink:href="#arm" transform="rotate(120)"/>
    <use xlink:href="#arm" transform="rotate(180)"/>
    <use xlink:href="#arm" transform="rotate(240)"/>
    <use xlink:href="#arm" transform="rotate(300)"/>
    <polygon points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5" fill="#6366f1"/>
    <circle r="3" fill="#ffffff"/>
  </g>
  <text x="104" y="62" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#0f172a">Snow<tspan fill="url(#ice)">crawl</tspan></text>
</svg>
